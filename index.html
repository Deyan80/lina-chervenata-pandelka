<!DOCTYPE html>
<html lang="bg" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Жест без име — Lina · Édition Privée</title>
<meta name="description" content="Луксозно издание за рождения ден на Lina: жест без име, панделка без цена, мъж, когото сторитата не назоваха.">
<meta property="og:type" content="article">
<meta property="og:title" content="Жест без име — Lina · Édition Privée">
<meta property="og:description" content="Осем страници за един рожден ден.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c110e;--ink:#f3eee4;--mute:rgba(243,238,228,.48);--sage:#8aaf96;--gold:#c4a46a;--line:rgba(138,175,150,.22);--page:#141b16;--pin:#f3eee4;--disp:'Bodoni Moda',Georgia,serif;--body:'DM Sans',system-ui,sans-serif}
[data-theme=light]{--bg:#f6f1e8;--ink:#16140f;--mute:rgba(22,20,15,.5);--sage:#4a7a60;--gold:#8a6038;--line:rgba(74,122,96,.22);--page:#f4eee4;--pin:#1a1712}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300}
button,a{font:inherit;color:inherit}button{cursor:pointer}
.edition{min-height:100svh;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 4vw;gap:12px}
.brand{font-family:var(--disp);font-style:italic;letter-spacing:.22em;color:var(--gold);text-decoration:none}
.mast{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
.ctrl{min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:.68rem;letter-spacing:.16em}
.stage{flex:1;display:grid;grid-template-columns:56px 1fr 56px;align-items:center;gap:8px;padding:0 1vw 8px}
.navb{height:52px;width:52px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink)}
.navb:disabled{opacity:.28}
.book{position:relative;height:min(78vh,760px);max-width:1100px;margin:0 auto;width:100%;perspective:2400px;cursor:ew-resize}
.sheet{position:absolute;inset:0;border-radius:2px 10px 10px 2px;overflow:hidden;background:var(--page);color:var(--pin);box-shadow:18px 22px 50px rgba(0,0,0,.35),inset 0 0 0 1px rgba(196,164,106,.18);transform-origin:left center}
.sheet.incoming{z-index:1}.sheet.current{z-index:2}
.book.flip-next .sheet.current{animation:turn 780ms cubic-bezier(.65,0,.35,1) forwards}
.book.flip-prev .sheet.incoming{z-index:3;animation:unturn 780ms cubic-bezier(.65,0,.35,1) forwards}
@keyframes turn{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
@keyframes unturn{0%{transform:rotateY(-180deg)}100%{transform:rotateY(0)}}
.curl{position:absolute;right:0;top:0;bottom:0;width:72px;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.06))}
.cover{position:relative;height:100%;background:#0c110e}
.cover img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.cover-veil{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:8% 8% 10%;background:linear-gradient(180deg,rgba(8,12,10,.1) 20%,rgba(8,12,10,.88) 78%);color:#f3eee4}
.kicker{font-size:.68rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin:0 0 14px}
.cover h1,.page h2{font-family:var(--disp);margin:0 0 12px;line-height:.95}
.cover h1{font-size:clamp(2.8rem,7vw,5.6rem);font-weight:900;color:#f3eee4}
.cover h1 em{font-style:italic;font-weight:500;color:var(--gold)}
.aka{font-family:var(--disp);font-style:italic;letter-spacing:.16em;margin:16px 0 12px;color:var(--sage)}
.deck{max-width:36ch;color:rgba(243,238,228,.78);margin:0 0 22px}
.hint{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.page{height:100%;padding:6% 7%;overflow:auto;background:linear-gradient(90deg,rgba(0,0,0,.04),transparent 40px),var(--page)}
.page h2{font-size:clamp(1.8rem,3.4vw,2.8rem);color:var(--pin)}
.page p{color:color-mix(in oklab,var(--pin) 78%,transparent);font-size:1.02rem;line-height:1.75;margin:0 0 1em}
.page blockquote{font-family:var(--disp);font-style:italic;font-size:clamp(1.25rem,2.4vw,1.7rem);line-height:1.35;border-left:1px solid var(--gold);padding:.15em 0 .15em 1em;margin:1.4em 0;color:var(--pin)}
.toc ol{list-style:none;padding:0;margin:28px 0 0}
.toc li button{width:100%;display:flex;gap:18px;align-items:baseline;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left}
.toc li span{font-family:var(--disp);font-style:italic;color:var(--gold);width:2.2rem}
.toc li b{font-family:var(--disp);font-weight:500;font-size:1.35rem}
.split{display:grid;grid-template-columns:1fr 1fr;padding:0}
.plate{position:relative;border:0;padding:0;overflow:hidden;background:#0c110e;min-height:100%}
.plate img{width:100%;height:100%;object-fit:cover;object-position:55% 70%}
.plate span{position:absolute;left:16px;bottom:16px;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#f3eee4}
.essay-inner{padding:8%}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.facts div{border-top:1px solid var(--line);padding-top:10px}
.facts b{display:block;font-family:var(--disp);font-style:italic;margin-bottom:4px}
.facts span{font-size:.82rem;color:var(--mute)}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:calc(100% - 110px)}
.g4 button{position:relative;overflow:hidden;border:0;padding:0;background:#111;min-height:160px}
.g4 img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.g4 button:hover img{transform:scale(1.05)}
.g4 i{position:absolute;left:10px;bottom:10px;font-style:normal;font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:#f3eee4}
.share,.contacts{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.share a,.share button,.contacts a{min-height:44px;display:inline-flex;align-items:center;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.share .primary{background:var(--gold);color:#0c110e;border-color:var(--gold);font-weight:500}
.contacts a{flex-direction:column;align-items:flex-start;border-radius:14px;padding:12px 16px;text-transform:none;letter-spacing:0}
.contacts b{font-family:var(--disp);font-size:1.1rem;font-weight:500}
.folio{display:flex;justify-content:space-between;align-items:center;padding:10px 4vw 18px;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.dots{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.dots button{width:8px;height:8px;border-radius:50%;border:0;background:var(--line);padding:0}
.dots button.on{background:var(--gold)}
.lb{position:fixed;inset:0;z-index:80;background:rgba(6,10,8,.94);display:grid;place-items:center;padding:4vh 4vw}
.lb[hidden]{display:none!important}
.lb img{max-width:92vw;max-height:86vh}
.lbx{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);color:#fff;background:transparent}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;background:var(--gold);color:#0c110e;padding:12px 22px;border-radius:999px;font-size:.78rem;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media(max-width:900px){
  .stage{grid-template-columns:1fr;padding:0 4vw 8px}
  .navb{display:none}
  .book{height:min(72vh,680px)}
  .split{grid-template-columns:1fr}
  .plate{min-height:38%}
  .mast{display:none}
}
@media(prefers-reduced-motion:reduce){.book.flip-next .sheet.current,.book.flip-prev .sheet.incoming{animation:none}}
</style>
</head>
<body>
<div class="edition">
  <header class="bar">
    <a class="brand" href="#">Lina</a>
    <span class="mast">Édition Privée</span>
    <div style="display:flex;gap:8px">
      <button class="ctrl" id="langBtn" type="button">EN</button>
      <button class="ctrl" id="themeBtn" type="button">Светла</button>
    </div>
  </header>
  <div class="stage">
    <button class="navb" id="prev" type="button" aria-label="Back">‹</button>
    <div class="book" id="book">
      <article class="sheet current" id="current"></article>
      <article class="sheet incoming" id="incoming" hidden></article>
      <div class="curl"></div>
    </div>
    <button class="navb" id="next" type="button" aria-label="Next">›</button>
  </div>
  <footer class="folio">
    <span id="folioLeft">Издание 2026</span>
    <ol class="dots" id="dots"></ol>
    <span id="folioRight">01 / 08</span>
  </footer>
</div>
<div class="lb" id="lb" hidden>
  <button class="lbx" id="lbx" type="button">×</button>
  <img id="lbi" alt="">
</div>
<div class="toast" id="toast"></div>
<script>
const T={
  title:{bg:'Жест без име — Lina · Édition Privée',en:'A Gesture Without a Name — Lina · Édition Privée'},
  folio:{bg:'Издание 2026',en:'Edition 2026'},
  light:{bg:'Светла',en:'Light'}, dark:{bg:'Тъмна',en:'Dark'},
  copy:{bg:'Копирай линка',en:'Copy link'}, copied:{bg:'Линкът е копиран',en:'Link copied'},
  copiedIg:{bg:'Линкът е копиран — постави го в Instagram',en:'Link copied — paste it in Instagram'},
  share:{bg:'Сподели',en:'Share'},
  open:{bg:'Разлисти →',en:'Open the edition →'},
  deck:{bg:'Осем страници за един рожден ден.',en:'Eight pages for one birthday.'},
  tocH:{bg:'В това издание',en:'In this edition'},
  toc:[{bg:'Корица',en:'Cover'},{bg:'Съдържание',en:'Contents'},{bg:'Сторито',en:'The story'},{bg:'Подаръкът',en:'The gift'},{bg:'Жената',en:'The woman'},{bg:'Практиката',en:'The practice'},{bg:'Кадрите',en:'The plates'},{bg:'Колофон',en:'Colophon'}],
  coverH:{bg:'Жест<br><em>без име</em>',en:'A Gesture<br><em>Without a Name</em>'}
};
const PAGES=[
  {id:'cover'},
  {id:'toc'},
  {id:'story', k:{bg:'I · Сторито',en:'I · The story'}, h:{bg:'Двадесет и четири часа празник',en:'Twenty-four hours of a feast'},
   pull:{bg:'Тя не обяви рождения ден. Тя го остави да изтече, както изтича стори.',en:'She did not announce the birthday. She let it expire, the way a story expires.'},
   body:{bg:[
     'Не гледах репортаж. Гледах как една жена решава какво да остане видимо за едно денонощие. Lina пусна сторита и излезе от кадъра, преди кадърът да я обясни. Това е лукс, който малко хора си позволяват: да покажеш празника и да не му напишеш програма.',
     'Първото стори беше тя. Черна коса като завеса, тесни стъкла, бял силует, чанта, която светът вече е научил да разпознава без етикет. Татуировките по ръката не са украса. Те са текст, който се чете само ако си достатъчно близо — и Lina рядко кани чак дотам.',
     'Погледът е същият, с който през 2019-а взе Mrs. Bulgaria International. Не моли. Не се усмихва, за да бъде харесана. Спира стаята. В сторитата от рождения ден тази стойка беше целия протокол.'
   ],en:[
     'I was not watching a report. I was watching a woman decide what would remain visible for a single day. Lina posted the stories and stepped out of the frame before the frame could explain her. That is a luxury few allow themselves: to show the feast and refuse to print a programme.',
     'The first story was her. Black hair like a curtain, narrow lenses, a white silhouette, a bag the world has already learned to recognise without a label. The tattoos on her arm are not decoration. They are text, readable only if you are close — and Lina rarely invites that far.',
     'The gaze is the same one that took Mrs. Bulgaria International in 2019. It does not ask. It does not smile in order to be liked. It stops the room. In the birthday stories, that carriage was the entire protocol.'
   ]}},
  {id:'gift', k:{bg:'II · Подаръкът',en:'II · The gift'}, h:{bg:'Червено върху сребро',en:'Red over silver'},
   pull:{bg:'Ключът беше в нейната ръка. Името върху панделката остана извън кадъра.',en:'The key was in her hand. The name on the ribbon stayed out of frame.'},
   body:{bg:[
     'После сторито смени декора. Паркинг, твърдо синьо небе, луксозен джип от последно поколение. Сребрист. Върху капака — панделка, вързана така, както се връзват неща, които не се купуват сами. Цена нямаше. Спецификация нямаше. Имаше само червено върху метал.',
     'До нея, в секунди, които Instagram ще изтрие до сутринта, се мярна мъжко присъствие: рамо, ръка, сянка в края на панорамата. Не беше представен. Не беше тагнат. Lina не го кръсти. Светският лист няма право да дописва биография там, където господарката на сторитата е избрала тишина.',
     'Остава въпросът, който празниците обичат повече от отговорите. Кой е мъжът до нея? Може да е жест. Може да е глава. Може да е някой, който умее да връзва панделка и после да остане извън подписа. В епоха на субтитри тази празнина е стил.'
   ],en:[
     'Then the story changed set. A car park, a hard blue sky, a latest-generation luxury SUV. Silver. On the hood — a ribbon, tied the way things are tied when they are not bought by the person holding the key. No price. No spec sheet. Only red on metal.',
     'Beside her, in seconds Instagram will erase by morning, a male presence flickered: a shoulder, a hand, a shadow at the edge of the pan. He was not introduced. He was not tagged. Lina did not name him. A society page has no right to invent a biography where the woman who owns the stories has chosen silence.',
     'What remains is the question feasts love more than answers. Who is the man beside her? It may be a gesture. It may be a chapter. It may be someone who knows how to tie a ribbon and then stay outside the caption. In an age of subtitles, that gap is style.'
   ]}},
  {id:'woman', k:{bg:'III · Жената',en:'III · The woman'}, h:{bg:'Преди панделката имаше корона',en:'Before the ribbon, a crown'},
   pull:{bg:'Който познава само подаръка, не познава Lina.',en:'Anyone who knows only the gift does not know Lina.'},
   body:{bg:[
     'Неделина Цанева е в модата близо петнадесет години — подиум, корици, камера. През 2019 г. става Mrs. Bulgaria International: титла за стойка, не за усмивка. После NUDE. После онази рядка корица на Playboy без акт на събличане — избор, който тогава прозвуча като манифест.',
     '2026-а ѝ върна светлината под друг ъгъл. Корица на GLAMOUR през февруари. MODE Spain през април. First Lady Award в категория „Ментор“. Конкурсната биография се пречупи в друга: жена, която вече не позира за корона, а държи пространство за други жени.'
   ],en:[
     'Nedelina Tsaneva has been in fashion for nearly fifteen years — runway, covers, camera. In 2019 she became Mrs. Bulgaria International: a title for carriage, not for a smile. Then NUDE. Then that rare Playboy cover without an act of undressing — a choice that then read as a manifesto.',
     '2026 returned the light at another angle. A GLAMOUR cover in February. MODE Spain in April. The First Lady Award in the Mentor category. The pageant biography broke into another: a woman who no longer poses for a crown, but holds space for other women.'
   ]},
   facts:[{y:'2019',bg:'Mrs. Bulgaria International',en:'Mrs. Bulgaria International'},{y:'2026',bg:'First Lady Award · Ментор',en:'First Lady Award · Mentor'},{y:'2026',bg:'Корици GLAMOUR и MODE Spain',en:'GLAMOUR & MODE Spain covers'}]},
  {id:'practice', k:{bg:'IV · Практиката',en:'IV · The practice'}, h:{bg:'Сертификатът не е аксесоар',en:'The certificate is not an accessory'},
   pull:{bg:'„Създавам пространство за жени, които усещат нуждата да намерят себе си.“',en:'“I create space for women who feel the need to find themselves.”'},
   body:{bg:[
     'Между корицата и панделката стои залата. Lina е сертифициран healing преподавател на световно ниво. Ментор, не инфлуенсър с одеяло. Практиките ѝ събират йога асани, пранаяма, медитация, афирмации и работа с карти в едно цяло, което се диша, не се харесва.',
     'Домът на тази работа е Vayana Yoga & Recharge Center на Симеоновско шосе 77. Групови занимания. Женски кръгове. Короната от 2019-а се оставя на входа. Световната сертификация за healing ментор не украсява титлата. Тя е втората биография: гръбнак, не снимка.',
     'В сторитата от рождения ден това изречение не беше написано. Беше във въздуха. Жена, която умее да приеме голям жест — и да не го превърне в каталог. Джипът беше кадър. Дишането остава практика.'
   ],en:[
     'Between the cover and the ribbon stands the studio. Lina is a world-certified healing teacher. A mentor, not an influencer with a blanket. Her practice gathers yoga asanas, pranayama, meditation, affirmations and card work into a whole that is breathed, not liked.',
     'The home of that work is Vayana Yoga & Recharge Center on Simeonovsko Shosse 77. Group sessions. Women\'s circles. The 2019 crown is left at the door. The world certification as a healing mentor does not decorate the title. It is the second biography: a spine, not a photograph.',
     'That sentence was not written on the birthday stories. It was in the air. A woman who can receive a large gesture — and refuse to turn it into a catalogue. The SUV was a frame. The breath remains a practice.'
   ]}},
  {id:'plates'},
  {id:'colo'}
];
const PLATES=[{src:'photo1.jpg',bg:'Присъствие',en:'Presence',pos:'50% 12%'},{src:'photo2.jpg',bg:'Подаръкът',en:'The gift',pos:'55% 70%'},{src:'photo3.jpg',bg:'Лято',en:'Summer',pos:'center'},{src:'photo4.jpg',bg:'Басейн',en:'Pool',pos:'center'}];

let lang=localStorage.getItem('lina-lang')==='en'?'en':'bg';
let theme=localStorage.getItem('lina-theme')||'dark';
let page=0, busy=false;
const total=PAGES.length;
const L=k=>T[k][lang];
const tx=(o)=>o[lang];

function applyChrome(){
  document.documentElement.lang=lang;
  document.documentElement.setAttribute('data-theme',theme);
  document.title=L('title');
  document.getElementById('langBtn').textContent=lang==='bg'?'EN':'БГ';
  document.getElementById('themeBtn').textContent=theme==='dark'?L('light'):L('dark');
  document.getElementById('folioLeft').textContent=L('folio');
}
document.getElementById('langBtn').onclick=()=>{lang=lang==='bg'?'en':'bg';localStorage.setItem('lina-lang',lang);applyChrome();render(page);};
document.getElementById('themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('lina-theme',theme);applyChrome();};

function essayHTML(p){
  return `<div class="essay-inner"><p class="kicker">${tx(p.k)}</p><h2>${tx(p.h)}</h2>${p.body[lang].map(t=>`<p>${t}</p>`).join('')}<blockquote>${tx(p.pull)}</blockquote>${p.facts?`<div class="facts">${p.facts.map(f=>`<div><b>${f.y}</b><span>${tx(f)}</span></div>`).join('')}</div>`:''}</div>`;
}
function pageHTML(i){
  const p=PAGES[i];
  if(p.id==='cover') return `<div class="cover"><img src="photo1.jpg" alt="Lina"><div class="cover-veil"><p class="kicker">Édition Privée · 2026</p><h1>${L('coverH')}</h1><p class="aka">Lina · Неделина Цанева</p><p class="deck">${L('deck')}</p><span class="hint">${L('open')}</span></div></div>`;
  if(p.id==='toc') return `<div class="page toc"><p class="kicker">${tx(T.toc[1])}</p><h2>${L('tocH')}</h2><ol>${T.toc.map((t,n)=>`<li><button type="button" data-jump="${n}"><span>${String(n+1).padStart(2,'0')}</span><b>${tx(t)}</b></button></li>`).join('')}</ol></div>`;
  if(p.id==='gift') return `<div class="page split"><button class="plate" type="button" data-full="photo2.jpg"><img src="photo2.jpg" alt=""><span>${lang==='bg'?'Кадър · Подаръкът':'Plate · The gift'}</span></button>${essayHTML(p)}</div>`;
  if(p.id==='plates') return `<div class="page"><p class="kicker">${lang==='bg'?'V · Кадрите':'V · The plates'}</p><h2>${lang==='bg'?'Четири сторита, които останаха':'Four stories that stayed'}</h2><div class="g4">${PLATES.map(x=>`<button type="button" data-full="${x.src}"><img src="${x.src}" alt="${tx(x)}" style="object-position:${x.pos}"><i>${tx(x)}</i></button>`).join('')}</div></div>`;
  if(p.id==='colo'){
    const url=encodeURIComponent(location.href.split('#')[0]);
    const text=encodeURIComponent(L('title')+' — '+location.href.split('#')[0]);
    return `<div class="page" data-noshare="1"><p class="kicker">${lang==='bg'?'VI · Колофон':'VI · Colophon'}</p><h2>${lang==='bg'?'Изпрати изданието':'Send the edition'}</h2><p>${lang==='bg'?'Копирай линка или го пусни във Facebook, Instagram, WhatsApp, Viber, Telegram и X.':'Copy the link or send it on Facebook, Instagram, WhatsApp, Viber, Telegram and X.'}</p>
      <div class="share">
        <button type="button" class="primary" data-copy="1">${L('copy')}</button>
        <button type="button" data-native="1">${L('share')}</button>
        <a href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank" rel="noopener">Facebook</a>
        <button type="button" data-ig="1">Instagram</button>
        <a href="https://wa.me/?text=${text}" target="_blank" rel="noopener">WhatsApp</a>
        <a href="viber://forward?text=${text}">Viber</a>
        <a href="https://t.me/share/url?url=${url}&text=${encodeURIComponent(L('title'))}" target="_blank" rel="noopener">Telegram</a>
        <a href="https://twitter.com/intent/tweet?url=${url}&text=${encodeURIComponent(L('title'))}" target="_blank" rel="noopener">X</a>
      </div>
      <div class="contacts">
        <a href="https://www.facebook.com/nelsun.tsaneva" target="_blank" rel="noopener"><b>Facebook</b><small>nelsun.tsaneva</small></a>
        <a href="https://www.instagram.com/lina_official_999/" target="_blank" rel="noopener"><b>Instagram</b><small>lina_official_999</small></a>
      </div>
      <p style="font-size:.78rem;letter-spacing:.12em;color:var(--mute)">© 2026 Lina · Неделина Цанева</p></div>`;
  }
  return `<div class="page">${essayHTML(p)}</div>`;
}
function bindPage(root){
  root.querySelectorAll('[data-jump]').forEach(b=>b.onclick=e=>{e.stopPropagation();go(+b.dataset.jump);});
  root.querySelectorAll('[data-full]').forEach(b=>b.onclick=e=>{e.stopPropagation();openLb(b.dataset.full);});
  root.querySelectorAll('[data-copy]').forEach(b=>b.onclick=e=>{e.stopPropagation();copyLink();});
  root.querySelectorAll('[data-native]').forEach(b=>b.onclick=e=>{e.stopPropagation();shareNative();});
  root.querySelectorAll('[data-ig]').forEach(b=>b.onclick=e=>{e.stopPropagation();copyLink(L('copiedIg'));window.open('https://www.instagram.com/','_blank','noopener');});
  root.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.stopPropagation()));
}
function render(i){
  const cur=document.getElementById('current');
  cur.innerHTML=pageHTML(i);
  bindPage(cur);
  document.getElementById('folioRight').textContent=String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0');
  document.getElementById('prev').disabled=i===0;
  document.getElementById('next').disabled=i===total-1;
  document.getElementById('dots').innerHTML=PAGES.map((_,n)=>`<li><button type="button" class="${n===i?'on':''}" data-go="${n}"></button></li>`).join('');
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
}
function go(target){
  if(busy||target<0||target>=total||target===page) return;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){page=target;render(page);return;}
  busy=true;
  const dir=target>page?'next':'prev';
  const inc=document.getElementById('incoming');
  inc.hidden=false;
  inc.innerHTML=pageHTML(target);
  bindPage(inc);
  const book=document.getElementById('book');
  book.classList.add('flip-'+dir);
  setTimeout(()=>{
    page=target; render(page);
    inc.hidden=true; inc.innerHTML='';
    book.classList.remove('flip-next','flip-prev');
    busy=false;
  },780);
}
document.getElementById('prev').onclick=()=>go(page-1);
document.getElementById('next').onclick=()=>go(page+1);
document.getElementById('book').addEventListener('click',e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const x=e.clientX-r.left;
  if(x>r.width*.82) go(page+1);
  else if(x<r.width*.18) go(page-1);
});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').hidden && e.key==='Escape'){closeLb();return;}
  if(e.key==='ArrowRight') go(page+1);
  if(e.key==='ArrowLeft') go(page-1);
});
let startX=0;
document.getElementById('book').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;},{passive:true});
document.getElementById('book').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-startX;
  if(dx<-50) go(page+1); else if(dx>50) go(page-1);
},{passive:true});

const toast=document.getElementById('toast'); let tt;
function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),2200);}
function pageUrl(){return location.href.split('#')[0];}
async function copyLink(msg){
  try{await navigator.clipboard.writeText(pageUrl());}
  catch{const t=document.createElement('textarea');t.value=pageUrl();document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
  showToast(msg||L('copied'));
}
async function shareNative(){
  if(navigator.share){try{await navigator.share({title:L('title'),text:L('title'),url:pageUrl()});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  copyLink();
}
function openLb(src){document.getElementById('lbi').src=src;document.getElementById('lb').hidden=false;}
function closeLb(){document.getElementById('lb').hidden=true;document.getElementById('lbi').src='';}
document.getElementById('lbx').onclick=closeLb;
document.getElementById('lb').onclick=e=>{if(e.target.id==='lb')closeLb();};

applyChrome();
render(0);
</script>
</body>
